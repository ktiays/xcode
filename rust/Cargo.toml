[workspace]
members = ["xcode"]
resolver = "2"

[workspace.package]
edition = "2021"
license = "MIT"
repository = "https://github.com/EvanBacon/xcode"

[workspace.dependencies]
anyhow = "1"
indexmap = { version = "2.8", features = ["serde"] }
md-5 = "0.10"
quick-xml = { version = "0.38", features = ["serialize"] }
plist = "1"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
thiserror = "2"
tracing = "0.1"
walkdir = "2.5"
regex = "1"
tempfile = "3.18"
